nst solidEnd=Math.max(0,todIdx*DAY+DAY/2-startPx+7*DAY);const fadeEnd=Math.max(80,todIdx*DAY+DAY/2-startPx+30*DAY);return `linear-gradient(90deg,${c} 0px,${c} ${solidEnd}px,transparent ${fadeEnd}px)`}let PROJECT_STATUSES=[{id:'todo',label:'待處理',color:'#94a3b8',bg:'#eef1f5'},{id:'wip',label:'製作中',color:'#4f86df',bg:'#e3ecfb'},{id:'testing',label:'測試中',color:'#eba91e',bg:'#fff4d6'},{id:'done',label:'已完成',color:'#3ec295',bg:'#e3f6ec'},{id:'hold',label:'擱置中',color:'#a3a3a3',bg:'#eeeeee'}];let PRIORITIES=[{id:'low',label:'低',color:'#94a3b8',bg:'#eef1f5'},{id:'normal',label:'普通',color:'#4f86df',bg:'#e3ecfb'},{id:'high',label:'高',color:'#eba91e',bg:'#fff4d6'},{id:'urgent',label:'緊急',color:'#cf6f74',bg:'#ffe3e6'}];let REPORT_TYPES=[{id:'progress',label:'進度回報',color:'#4f86df',bg:'#e3ecfb',border:'#4f86df'},{id:'milestone',label:'特殊活動',color:'#eba91e',bg:'#fff4d6',border:'#e0a82a'},{id:'todo',label:'代辦',color:'#7c5cd0',bg:'#efeafb',border:'#b9a6ea'}];function statusObj(l){return PROJECT_STATUSES.find(s=>s.label===l)||PROJECT_STATUSES[0]}function priorityObj(id){return PRIORITIES.find(p=>p.id===id)||PRIORITIES[1]}function reportTypeObj(l){return REPORT_TYPES.find(r=>r.label===l)||REPORT_TYPES[0]}let STATUS_COLORS={};function syncStatusColors(){STATUS_COLORS={};PROJECT_STATUSES.forEach(s=>STATUS_COLORS[s.label]=s.color)}syncStatusColors();function showBranchDetail(ti,bi){const b=trunks[ti].branches[bi];detailPanel.classList.remove('collapsed');detailTitle.textContent=b.name;const body=document.querySelector('.detail-body');const bOwnersHtml=(b.owners||[]).map(id=>{const m=member(id);return `<span class="person-chip"><span class="tiny" style="background:${m[2]}">${m[0]}</span>${m[1]}</span>`}).join('')||'<span style="color:var(--muted);font-size:11px">尚未指派</span>';const bAddBtns=members.filter(m=>memberActive[m[0]]!==false&&!(b.owners||[]).includes(m[0])).map(m=>`<button class="add-owner" data-mid="${m[0]}" style="height:22px;padding:0 8px;border:1px dashed var(--line);backgroun function migrateDailyDocs(raws){

function _isMigId(id){return typeof id==='string'&&id.indexOf('__')>0&&/__\d+$/.test(id)}
function _migParse(id){const i=id.lastIndexOf('__');return{parentId:id.slice(0,i),idx:parseInt(id.slice(i+2))}}
async function updateDailyDoc(id,patch){
  if(!_isMigId(id))return db.collection('dailyReports').doc(id).update(patch);
  const{parentId,idx}=_migParse(id);
  const ref=db.collection('dailyReports').doc(parentId);
  const snap=await ref.get();if(!snap.exists)throw new Error('parent missing');
  const ents=Array.isArray(snap.data().entries)?[...snap.data().entries]:[];
  if(!ents[idx])throw new Error('entry missing');
  const ent={...ents[idx]};
  if('done' in patch)ent.done=patch.done;
  if('text' in patch)ent.note=patch.text;
  if('cat' in patch)ent.cat=(window._CAT_REV&&window._CAT_REV[patch.cat])||patch.cat;
  if('branch' in patch)ent.branchId=patch.branch;
  ents[idx]=ent;
  return ref.update({entries:ents});
}
async function deleteDailyDoc(id){
  if(!_isMigId(id))return db.collection('dailyReports').doc(id).delete();
  const{parentId,idx}=_migParse(id);
  const ref=db.collection('dailyReports').doc(parentId);
  const snap=await ref.get();if(!snap.exists)return;
  const ents=Array.isArray(snap.data().entries)?snap.data().entries.filter((_,i)=>i!==idx):[];
  if(ents.length===0)return ref.delete();
  return ref.update({entries:ents});
}

    const [tid,bid]=bSel.value.split('|');
    const title=(document.getElementById('rpTitle').value||'').trim();
    const desc=(document.getElementById('rpDesc').value||'').trim();
    if(!title&&!desc){toast('⚠ 請輸入標題或內容');return}
    const typeLabel=document.getElementById('reportType').value||'進度回報';
    const _rtObj=REPORT_TYPES.find(x=>x.label===typeLabel);
    const _isMile=typeLabel==='特殊活動'||!!(_rtObj&&_rtObj.id==='milestone');
    const today=new Date();
    let dateStr=today.getFullYear()+'-'+String(today.getMonth()+1).padStart(2,'0')+'-'+String(today.getDate()).padStart(2,'0');
    const md=document.getElementById('milestoneDate');
    if(_isMile&&md&&md.value)dateStr=md.value;
    const msg=title&&desc?(title+'\n'+desc):(title||desc);
    const _isTodo=typeLabel==='代辦'||!!(_rtObj&&_rtObj.id==='todo');
    if(_isTodo){
      const _ti=trunks.findIndex(t=>t.id===tid);
      const _bi=_ti>=0?trunks[_ti].branches.findIndex(b=>b.id===bid):-1;
      if(_ti<0||_bi<0){toast('⚠ 找不到枝幹');return}
      const _b=trunks[_ti].branches[_bi];
      if(!Array.isArray(_b.todos))_b.todos=[];
      snap();
      _b.todos.push({id:'todo_'+Date.now()+'_'+Math.random().toString(36).slice(2,7),text:msg,done:false,member:currentMemberId,date:dateStr});
      saveState();
      pushRecent('reportRecentType','代辦');
      document.getElementById('rpTitle').value='';
      document.getElementById('rpDesc').value='';
      pendImgs=[];pendLinks=[];refreshAttachState();
      toast('✓ 已新增代辦');
      showBranchDetail(_ti,_bi);
      return;
    }
    const newNode={trunk:tid,branch:bid,type:_isMile?'milestone':'progress',date:dateStr,member:currentMemberId,collaborators:[],msg,notes:'',images:[...pendImgs],links:pendLinks.map(u=>({url:u,title:u}))};
    try{
      const docRef=await db.collection('nodes').add(newNode);
      NODES_RAW.push({id:docRef.id,...newNode});
      pushRecent('reportRecentBranch',tid+'|'+bid);
      pushRecent('reportRecentType',typeLabel);
      if(pendingDailyDoneId){const _did=pendingDailyDoneId;pendingDailyDoneId='';try{await updateDailyDoc(_did,{done:true});const _r=DAILY_REPORTS_RAW.find(x=>x.id===_did);if(_r)_r.done=true;rebuildDailyWeekly();buildWeekly();refreshDaily()}catch(_){}}
      attachNodesToBranches();buildTimeline();populateReportSelects();
      document.getElementById('rpTitle').value='';
      document.getElementById('rpDesc').value='';
      pendImgs=[];pendLinks=[];refreshAttachState();
      const _br=branchNameById(bid);handleMentions(msg,_br,docRef.id);
      toast('✓ 已新增留言');
      const _tlTab=document.querySelector('.view-tab[data-view="timeline"]');if(_tlTab&&!document.getElementById('timeline').classList.contains('active'))_tlTab.click();
      setTimeout(()=>{const r=findEventByNodeId(docRef.id);if(!r)return;const[_ti,_bi,_ei]=r;requestAnimationFrame(()=>{let pin=document.querySelector('.pin[data-ti="'+_ti+'"][data-bi="'+_bi+'"][data-ei="'+_ei+'"]');if(!pin){const _row=document.querySelector('.grid-row[data-ti="'+_ti+'"][data-bi="'+_bi+'"]');if(_row){const _px=xAtDay(Math.round(trunks[_ti].branches[_bi].events[_ei][0]));let _best=null,_bd=1e9;_row.querySelectorAll('.pin').forEach(p=>{const dd=Math.abs((parseFloat(p.style.left)||0)-_px);if(dd<_bd){_bd=dd;_best=p}});pin=_best}}if(!pin)return;document.querySelectorAll('.bubble.selected').forEach(x=>x.classList.remove('selected'));const bub=pin.querySelector('.bubble');if(bub)bub.classList.add('selected');pin.scrollIntoView({behavior:'smooth',block:'center',inline:'center'})})},250);
    }catch(e){console.error(e);toast('⚠ 送出失敗：'+e.message)}
  };
  const addLine=document.querySelector('.add-line');
  if(addLine)addLine.onclick=()=>{
    if(!currentUser){toast('⚠ 請先登入');return}
    if(!currentMemberId){toast('⚠ 請選擇成員身份');return}
    const dateInp=document.getElementById('dailyDate');
    const d=new Date();
    const dateStr=(dateInp&&dateInp.value)||(d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'));
    const list=document.getElementById('dailyList');if(!list)return;
    const row=document.createElement('div');
    row.className='daily-item';
    const recentBr=getRecent('dailyRecentBranch');
    const recentCat=getRecent('dailyRecentCat');
    const defBr=recentBr[0]||'';
    const defCat=recentCat[0]||(CATS[0]&&CATS[0].label)||'開發';
    const defCObj=CATS.find(c=>c.label===defCat)||CATS[0]||{color:'#4f86df'};
    const defBrColor=branchColorById(defBr);
    const{brOpts,catOpts}=buildDailyOptionsHtml(defBr,defCat);
    row.innerHTML='<span class="checkbox"></span><select class="daily-branch-sel"'+(defBrColor?' style="border-left:3px solid '+defBrColor+'"':'')+'>'+brOpts+'</select><select class="daily-cat-sel" style="background:'+defCObj.color+'22;color:'+defCObj.color+'">'+catOpts+'</select><input class="daily-note-edit" placeholder="輸入內容…可 @ 標註，Enter 儲存／Shift+Enter 完成" style="flex:1;min-width:0;border:1px solid var(--blue);background:#fff;border-radius:5px;padding:2px 6px;font-family:inherit;font-size:11px;font-weight:800;color:var(--text);outline:none"><button class="daily-report-btn" title="輸入內容後可送到時間軸回報">↑回報</button><span class="rm">×</span>';
    list.appendChild(row);row.scrollIntoView({block:'nearest'});
    const inp=row.querySelector('.daily-note-edit');attachMention(inp);
    const brSelN=row.querySelector('.daily-branch-sel');
    const catSelN=row.querySelector('.daily-cat-sel');
    const cbN=row.querySelector('.checkbox');
    let newDone=false;
    if(cbN)cbN.onclick=e=>{e.stopPropagation();newDone=!newDone;row.classList.toggle('done',newDone);cbN.textContent=newDone?'✓':''};
    brSelN.onchange=()=>{const bC=branchColorById(brSelN.value);brSelN.style.borderLeft=bC?'3px solid '+bC:''};
    catSelN.onchange=()=>{const c=CATS.find(x=>x.label===catSelN.value)||CATS[0]||{color:'#4f86df'};catSelN.style.background=c.color+'22';catSelN.style.color=c.color};
    let committed=false;
    inp.focus();
    const commit=async()=>{
      if(committed)return;
      const txt=inp.value.trim();
      if(!txt)return;
      committed=true;
      const newDr={member:currentMemberId,date:dateStr,text:txt,cat:catSelN.value||defCat,done:newDone,branch:brSelN.value||''};
      try{
        const docRef=await db.collection('dailyReports').add(newDr);
        row.remove();
        DAILY_REPORTS_RAW.push({id:docRef.id,...newDr});
        if(newDr.branch)pushRecent('dailyRecentBranch',newDr.branch);
        if(newDr.cat)pushRecent('dailyRecentCat',newDr.cat);
        refreshDaily();rebuildDailyWeekly();buildWeekly();
        handleMentions(txt,newDr.branch?branchNameById(newDr.branch):'每日進度','');
        if(viaEnter&&addLine)setTimeout(()=>addLine.click(),60);
      }catch(e){console.error(e);toast('⚠ 新增失敗：'+e.message);committed=false}
    };
    let viaEnter=false;
    inp.onblur=()=>setTimeout(()=>{if(document.activeElement&&row.contains(document.activeElement))return;commit()},120);
    inp.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();if(e.shiftKey){newDone=true;row.classList.add('done');if(cbN)cbN.textContent='✓'}viaEnter=true;inp.blur()}else if(e.key==='Escape'){committed=true;row.remove()}};
    row.querySelector('.rm').onclick=e=>{e.stopPropagation();committed=true;row.remove()};
    const rbN=row.querySelector('.daily-report-btn');
    if(rbN)rbN.onclick=async e=>{
      e.stopPropagation();
      const openDrawer=(docId,text,branch)=>{
        const drawer=document.querySelector('.report-drawer');if(drawer)drawer.classList.remove('collapsed');
        const titleEl=document.getElementById('rpTitle');if(titleEl){titleEl.value=text||'';titleEl.focus()}
        const bSel=document.getElementById('rpBranchSel');
        if(bSel&&branch){let tid='';for(const t of trunks){if((t.branches||[]).some(b=>b.id===branch)){tid=t.id;break}}if(tid)bSel.value=tid+'|'+branch}
        pendingDailyDoneId=docId||'';
        toast(docId?'已帶入回報，送出後將自動完成此項':'已開啟回報，請輸入內容');
      };
      const txt=inp.value.trim();
      if(txt&&!committed){
        committed=true;
        const newDr={member:currentMemberId,date:dateStr,text:txt,cat:catSelN.value||defCat,done:newDone,branch:brSelN.value||''};
        try{
          const docRef=await db.collection('dailyReports').add(newDr);
          row.remove();
          DAILY_REPORTS_RAW.push({id:docRef.id,...newDr});
          if(newDr.branch)pushRecent('dailyRecentBranch',newDr.branch);
          if(newDr.cat)pushRecent('dailyRecentCat',newDr.cat);
          refreshDaily();rebuildDailyWeekly();buildWeekly();
          openDrawer(docRef.id,newDr.text,newDr.branch);
        }catch(err){console.error(err);toast('⚠ 新增失敗：'+err.message);committed=false}
      }else{
        openDrawer('',txt,brSelN.value||'');
      }
    };
  };
  const dDate=document.getElementById('dailyDate');
  if(dDate)dDate.onchange=()=>refreshDaily();
  let _autoToday='';
  function autoBumpDailyDate(){const el=document.getElementById('dailyDate');if(!el)return;const t=new Date();const today=t.getFullYear()+'-'+String(t.getMonth()+1).padStart(2,'0')+'-'+String(t.getDate()).padStart(2,'0');if(!el.value||el.value===_autoToday){if(el.value!==today){el.value=today;if(typeof refreshDaily==='function')refreshDaily()}}_autoToday=today}
  autoBumpDailyDate();
  setInterval(autoBumpDailyDate,60000);
})();
const _origRerenderAll=rerenderAll;
rerenderAll=function(){_origRerenderAll();refreshDaily();refreshAttachState()};
</script>
</body>
</html>
